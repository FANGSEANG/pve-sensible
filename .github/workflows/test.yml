name: Shell checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Bash syntax
        run: |
          if LC_ALL=C grep -n $'\r' pve-sensible.sh; then
            echo 'pve-sensible.sh contains CRLF/CR characters' >&2
            exit 1
          fi
          bash -n pve-sensible.sh
      - name: Validate PVE 9.2 version assignment matcher
        shell: bash
        run: |
          PVE_SENSIBLE_LIB_ONLY=1 source ./pve-sensible.sh
          test_file=$(mktemp)
          cat > "$test_file" <<'EOF'
              $res->{pveversion} = PVE::pvecfg::package() . "/" . PVE::pvecfg::version_text();
          EOF
          insert_nodes_summary "$test_file"
          grep -q 'PVE_SENSIBLE_OVERVIEW' "$test_file"
      - name: Validate PVE Manager overview insertion matcher
        shell: bash
        run: |
          PVE_SENSIBLE_LIB_ONLY=1 source ./pve-sensible.sh
          test_file=$(mktemp)
          block=$(mktemp)
          cat > "$test_file" <<'EOF'
          {
              itemId: 'version',
              title: gettext('PVE Manager Version'),
              textField: 'pveversion',
              value: '',
          },
          EOF
          OVERVIEW_ALIGN=r
          write_overview_js_block "$block"
          insert_after_pveversion "$test_file" "$block"
          grep -q 'PVE_SENSIBLE_OVERVIEW' "$test_file"
          grep -q "textAlign: 'right'" "$test_file"
      - name: Validate CT template mirror replacement matcher
        shell: bash
        run: |
          PVE_SENSIBLE_LIB_ONLY=1 source ./pve-sensible.sh
          test_file=$(mktemp)
          cat > "$test_file" <<'EOF'
          my $url = 'http://download.proxmox.com/images/system';
          EOF
          CT_URI=https://mirrors.tuna.tsinghua.edu.cn/proxmox
          replace_ct_source "$test_file" "$CT_URI"
          grep -qF "$CT_URI/images/system" "$test_file"
      - name: Validate subscription popup matcher
        shell: bash
        run: |
          PVE_SENSIBLE_LIB_ONLY=1 source ./pve-sensible.sh
          test_file=$(mktemp)
          cat > "$test_file" <<'EOF'
          Proxmox.Utils.API2Request({
              url: '/nodes/localhost/subscription',
              success: function(response) {
                  let res = response.result;
                  if (res === null || res === undefined || !res || res.data.status.toLowerCase() !== 'active') {
                      Ext.Msg.show({ title: gettext('No valid subscription') });
                  }
              },
          });
          EOF
          disable_subscription_in_file "$test_file"
          grep -q 'PVE_SENSIBLE_NO_SUBSCRIPTION' "$test_file"
          grep -q 'if(false)' "$test_file"
      - name: Validate failed menu actions do not terminate caller
        shell: bash
        run: |
          PVE_SENSIBLE_LIB_ONLY=1 source ./pve-sensible.sh
          fail_action() { die 'expected test failure'; }
          run_menu_action '测试操作' fail_action
          echo 'menu continues'
